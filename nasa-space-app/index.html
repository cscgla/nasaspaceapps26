<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triple C Wellness App</title>
  <meta name="description" content="Clickable web build of the Nasa Space App Figma prototype.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <div id="stage" class="stage" role="group" aria-label="App screen">
      <img id="screen" class="screen" alt="" draggable="false">
      <div id="hotspots"></div>
    </div>
    <div id="gallery" class="gallery" hidden></div>
  </main>

  <nav class="toolbar" aria-label="Prototype controls">
    <button type="button" id="btn-restart">Restart</button>
    <button type="button" id="btn-gallery">Asset gallery</button>
    <span id="crumb" class="crumb"></span>
  </nav>

  <script src="js/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
